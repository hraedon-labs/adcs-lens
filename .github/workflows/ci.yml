name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Parked-project rot canary: a monthly run surfaces dependency, Python, or
    # runner drift as a failed-run email instead of a re-entry surprise.
    - cron: "17 6 3 * *"
  # release.yml re-runs this whole workflow on the tagged commit.
  workflow_call:
    secrets:
      FORBIDDEN_IDENTIFIERS:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identifier-gate:
    # Guard against committing real AD CS export data: always-on check that no
    # tracked file lives under samples/ (git add -f would bypass .gitignore),
    # plus a secret-driven scan for forbidden work-domain identifiers. The scan
    # is a no-op until FORBIDDEN_IDENTIFIERS is configured.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # gate walks history when publication.toml is absent; refuses shallow
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check for committed export data / forbidden identifiers
        env:
          FORBIDDEN_IDENTIFIERS: ${{ secrets.FORBIDDEN_IDENTIFIERS }}
        run: python scripts/check_committed_identifiers.py

  lint-typecheck-test:
    runs-on: ubuntu-latest
    # 11-12 min on main before the 0.12.0 tests; the PR that added them was
    # cancelled at 15. The mutation gate runs inside pytest.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The cert-watch v0.6.5 local/CI version gap is on record — gate both.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Lockfile is current
        run: uv lock --check

      - name: Install from the lockfile (with [certs] so the lifecycle path runs)
        run: uv sync --locked --extra dev --extra certs --group release --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Mypy typecheck (strict)
        run: .venv/bin/mypy src

      - name: Run tests (incl. the pwsh-parsed collector read-only allowlist)
        run: |
          pwsh --version
          .venv/bin/pytest -q

  supply-chain:
    # Audit every locked dependency (runtime extras, the dev tooling CI
    # executes, and the release build toolchain) against known vulnerabilities. --strict fails on any finding
    # or on a package that cannot be audited. pip-audit itself is pinned.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Lockfile is current
        run: uv lock --check

      - name: Export locked dependencies
        run: uv export --locked --all-extras --all-groups --no-emit-project --format requirements-txt -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit@2.10.1 --strict --requirement requirements-audit.txt

  verify-action-pins:
    # Every `uses: owner/repo@<sha> # vX.Y.Z` pin must be exactly that tag's
    # commit (annotated tags dereferenced) — a fabricated or stale SHA fails.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install the locked dev tooling (PyYAML parses the workflows)
        run: uv sync --locked --extra dev

      - name: Verify action pins against upstream tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/verify_action_pins.py .github/workflows

  collector-helpers:
    # The collector's OS-independent helpers (bit decoders, certutil parsers, IIS
    # classifiers) are unit-tested on Linux pwsh via -FunctionsOnly.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion 5.7.1

      - name: Run collector helper tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $r = Invoke-Pester -Path tests/collector/Collector.Tests.ps1 -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

  installer-helpers:
    # The Windows installer's pure helper functions (version parsing, shared-
    # Python detection) are unit-tested on Linux pwsh via dot-sourcing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion 5.7.1

      - name: Run installer helper tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $r = Invoke-Pester -Path tests/powershell/install-windows.Tests.ps1 -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

  collector-windows:
    # _parseAces uses System.DirectoryServices (.NET) to decode an
    # nTSecurityDescriptor (the ESC1/4/5/7 input) — can't run on Linux pwsh, so it
    # is covered here on a real Windows runner via a self-built descriptor.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion 5.7.1

      - name: Collector parses under Windows PowerShell 5.1
        # The read-only allowlist test (tests/test_collector_readonly.py) parses
        # with pwsh 7; the collector must also parse on 5.1, where it runs.
        shell: powershell
        run: |
          $errs = $null; $tok = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/Export-AdcsEstate.ps1).Path, [ref]$tok, [ref]$errs)
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: Run Windows collector tests
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $r = Invoke-Pester -Path tests/collector/windows -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Run installer helper tests (PS 5.1)
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $r = Invoke-Pester -Path tests/powershell/install-windows.Tests.ps1 -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }
