[project]
name = "adcs-lens"
version = "1.2.0"
description = "Local-first, read-only AD CS / PKI posture analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "hraedon" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
# The deterministic core is stdlib-only by charter (portable, air-gappable).
dependencies = []

[project.optional-dependencies]
# Pins include upper bounds to keep CI reproducible against future major versions.
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.16,<0.17",
    "mypy>=1.13,<2",
    "jsonschema>=4.23,<5",
    # scripts/verify_action_pins.py parses workflows (CI verify-action-pins job).
    "pyyaml>=6.0.2,<7",
]
# Cert/CRL (DER) parsing for the lifecycle path. The core never imports this;
# when absent, lifecycle fields are None and lifecycle checks degrade to a note.
certs = [
    "cryptography>=50,<51",
]
# Optional layers, kept out of the truth path. They are currently empty
# placeholders; see future plans. Installing them succeeds but adds nothing.
narration = []
web = []

[dependency-groups]
# The release build toolchain, locked in uv.lock so release.yml builds with a
# pinned backend (--no-isolation) instead of resolving hatchling at run time.
release = [
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
]

[project.urls]
Source = "https://github.com/hraedon-labs/adcs-lens"
Issues = "https://github.com/hraedon-labs/adcs-lens/issues"

[project.scripts]
adcs-lens = "adcs_lens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adcs_lens"]

# Explicit sdist contents: an untracked/scratch directory in a working tree must
# not change the sdist, so a local double-build matches the CI release build.
[tool.hatch.build.targets.sdist]
# Everything the test suite reads must ship, so the suite runs from the sdist
# (tests/test_sdist.py builds one and runs the file-reading tests from it).
include = [
    "/src/adcs_lens",
    "/tests",
    "/scripts",
    "/githooks",
    "/.github",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/AGENTS.md",
    "/LICENSE",
    "/publication.toml",
    "/uv.lock",
]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "certs: requires the [certs] extra (cryptography) for DER cert/CRL parsing",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Reviewer probe files are kept byte-for-byte as delivered (fixtures, not code).
extend-exclude = ["tests/fixtures/reviewer_probes"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
